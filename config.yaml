# weekly_momentum_v2 — machine-readable parameters
# Companion to docs/STRATEGY_SPEC.md. Every number here is justified there.
# Code reads THIS file. No magic numbers anywhere else.

strategy:
  name: weekly_momentum_v2
  version: 2.0.0
  spec: docs/STRATEGY_SPEC.md

# ---------------------------------------------------------------- capital
account:
  capital: 15000
  currency: USD
  paper_trading: true          # MUST stay true until acceptance criteria pass
  fractional_shares: true

# ---------------------------------------------------------------- universe
universe:
  source: SP500
  benchmark: SPY
  min_dollar_volume_20d: 20000000
  min_price: 10.00
  min_days_listed: 400
  security_types: [COMMON]
  max_symbols: 150             # IBKR pacing: ~6 symbols/min -> ~25 min refresh
  constituents_path: ./data/universe/sp500_constituents.csv
  constituents_max_age_days: 100   # older -> warn, never halt (spec 2.1)
  adv_window_days: 20

# ---------------------------------------------------------------- data
data:
  cache_dir: ./data/cache
  cache_format: parquet
  history_years: 22          # 22 -> data from ~2004 so 2008 is testable (spec 1.0.2)
  bar_size: "1 day"
  what_to_show: ADJUSTED_LAST
  min_bars_required: 300
  ibkr_requests_per_minute: 6  # stay under 60 per 10 minutes
  max_stale_days: 5            # exceed -> halt, generate no orders
  overlap_days: 5              # incremental fetch overlap, for restatement checks
  restatement_tolerance: 0.001 # overlap close differs by more -> full refetch
  volume_multiplier: 1         # 1 = IBKR volume is in shares; 100 if in round lots

# ---------------------------------------------------------------- signals
signals:
  momentum:
    skip_days: 21
    lookback_short: 147        # ~6 months
    lookback_long: 273         # ~12 months
    weight_short: 0.5
    weight_long: 0.5
  volatility:
    window: 63
    annualize: 252
    floor: 0.10                # score denominator floor
  trend_filter:
    symbol: SPY
    ma_period: 200
    ma_type: SMA
  atr:
    period: 20

# ---------------------------------------------------------------- entry
entry:
  require_market_on: true
  rank_threshold: 10           # v2 change 4 (was 6)
  min_momentum: 0.0
  max_volatility: 0.80
  require_ai_veto_pass: true
  # E9 (max_new_per_rebalance) is gone in v2.0.0: refill toward the target replaces it

# After a FULL exit a name may be bought again only when all of these hold (spec 6.2).
reentry:
  max_rank: 10
  sma_days: 50                 # close must be above its own 50-day SMA
  min_weeks_after_exit: 1

# ---------------------------------------------------------------- exit
exit:
  rank_exit: 16                # buffer vs entry rank 10 — prevents churn
  exit_on_negative_momentum: true
  ladder:                      # trailing stop from the highest CLOSE since entry (spec 6.1)
    drawdowns: [0.12, 0.20, 0.28]   # sell 1/3, another 1/3, then the rest; each fires once

# Graded market filter and the invested-fraction target (spec 4.1, 8).
regime:
  target_normal: 0.85          # invested fraction while the filter is on
  target_defensive: 0.40       # set ONLY by the market filter
  confirm_weeks: 2             # consecutive weekly readings needed to switch
  refill_below: 0.80           # invested below this -> buy toward the target
  defensive_trim_band: 0.05    # defensive: trim pro rata when invested > target + band

# ---------------------------------------------------------------- sizing
sizing:
  method: inverse_volatility
  max_position_weight: 0.15
  min_position_weight: 0.05
  min_position_value: 1000

# ---------------------------------------------------------------- schedule
schedule:
  timezone: America/New_York
  data_refresh: "SAT 18:00"
  exit_check: weekly
  entry_check: weekly          # refill toward the target; no monthly cap (v2)
  execution_time: "MON 09:45"  # avoid the opening auction

# ---------------------------------------------------------------- risk
risk:
  max_gross_exposure: 1.00     # NO LEVERAGE
  max_positions: 10
  max_sector_weight: 0.40
  max_orders_per_day: 8
  max_order_value: 4000
  halt_on_drawdown: 0.20
  halt_on_broker_disconnect: true
  require_manual_approval: true

# LIVE ONLY. Not simulated in the backtest (spec 8.2). Caps the invested target
# below the regime target; can never raise it and can never exceed `normal`.
risk_dial:
  levels:
    normal: 0.85
    caution: 0.60
  min_days_between_changes: 30
  expiry_weeks: 4

# ---------------------------------------------------------------- ai layer
ai:
  enabled: true
  role: veto_only              # cannot signal, size, or order
  on_failure: proceed_and_log  # an outage must not halt trading
  flag_categories:
    - pending_merger_acquisition
    - accounting_investigation
    - delisting_notice
    - bankruptcy_filing
    - fraud_allegation
    - trading_halt

# ---------------------------------------------------------------- execution
execution:
  order_type: LIMIT            # never a bare market order
  limit_offset_pct: 0.003      # marketable limit
  time_in_force: DAY
  ibkr_host: 127.0.0.1
  ibkr_port: 4002              # 4002 paper | 4001 live (IB Gateway)
  client_id: 17

# ---------------------------------------------------------------- backtest
backtest:
  start: "2007-01-01"
  walk_forward:
    in_sample_years: 3
    out_of_sample_years: 1
    step_months: 12
  costs:
    commission_per_share: 0.005
    commission_min: 1.00
    slippage_bps: 5
    spread_bps: 3
  parameter_change_budget: 5
  acceptance:
    beat_benchmark: true
    beat_benchmark_margin: 0.02  # A1: CAGR >= SPY + 2.0 points (v2; harder, not easier)
    max_drawdown: 0.35
    worst_rolling_12m: -0.30
    min_sharpe: 0.6
    max_annual_turnover: 4.00
    max_single_window_contribution: 0.50
